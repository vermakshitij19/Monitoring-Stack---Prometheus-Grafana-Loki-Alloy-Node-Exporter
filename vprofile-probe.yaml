
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vprofile-website
  namespace: monitoring
  labels:
    release: monitoring
spec:
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - https://vprofile.latun.store
      labels:
        application: vprofile
        environment: dev
